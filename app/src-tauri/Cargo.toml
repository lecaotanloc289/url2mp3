[package]
name = "url2mp3-app"
description = "url2mp3 app: download music from YouTube, TikTok and more as MP3/M4A/Opus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "url2mp3_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
url2mp3-core = { path = "../../crates/core" }
anyhow.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
tokio.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile.workspace = true
