[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lecaotanloc289/url2mp3"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
indicatif = "0.18.6"
# HTTP/1.1 only on purpose: N real TCP connections beat N streams multiplexed on one h2 connection.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "signal"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
